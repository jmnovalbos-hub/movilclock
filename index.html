<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dojo Tokio School · Formación interna</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#000A5E; --teal:#30D9C4; --pink:#FF4F9A;
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#0C1240; --muted:#4F5679; --line:#D9DDEC;
  --accent:#000A5E; --accent-ink:#FFFFFF; --soft:#E6F9F6; --soft-ink:#075E54;
  --focus:#FF4F9A;
  --display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --body:"Albert Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#060A2E; --surface:#0E1446; --ink:#EEF0FF; --muted:#A9AFD6; --line:#252C66;
    --accent:#30D9C4; --accent-ink:#04103A; --soft:#10304A; --soft-ink:#8FF0E3; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060A2E; --surface:#0E1446; --ink:#EEF0FF; --muted:#A9AFD6; --line:#252C66;
  --accent:#30D9C4; --accent-ink:#04103A; --soft:#10304A; --soft-ink:#8FF0E3; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);font-size:clamp(16px, calc(10px + .5vw), 19px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:1.0625rem;line-height:1.6}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
button{font:inherit;color:inherit}
img{max-width:100%}

.app{display:grid;grid-template-columns:clamp(16rem,17vw,21rem) minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#fff;padding:2rem 1.5rem;position:sticky;top:0;height:100vh;overflow:auto;display:flex;flex-direction:column;gap:1.75rem}
.brand{font-family:var(--display);font-weight:700;font-size:1.15rem;letter-spacing:-.01em;line-height:1.2}
.brand-logo{display:block;width:clamp(96px,7vw,128px);height:auto}
.brand-wide{display:flex;flex-direction:column;align-items:center;text-align:center;gap:.9rem}
.brand-wide small{margin-top:0}
.topbar .brand-logo{width:auto;height:56px}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:.85rem;color:#B9BEF0;letter-spacing:0;margin-top:.35rem}

/* Belt: the one memorable element */
.belt-wrap{background:rgba(255,255,255,.06);border-radius:14px;padding:1rem}
.belt-label{font-size:.85rem;color:#B9BEF0;margin:0 0 .5rem}
.belt-name{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 .75rem}
.belt{position:relative;height:22px;border-radius:4px;background:var(--belt,#fff);transition:background .5s ease;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.belt::after{content:"";position:absolute;right:18%;top:-6px;width:22px;height:34px;background:inherit;border-radius:3px;transform:rotate(12deg);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.belt-steps{display:flex;gap:4px;margin-top:.9rem}
.belt-steps span{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.15)}
.belt-steps span.on{background:var(--teal)}

.nav{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:grid;grid-template-columns:1.75rem 1fr auto;align-items:center;gap:.5rem;width:100%;box-sizing:border-box;padding:.6rem .7rem;border-radius:10px;font-size:.98rem;color:#DADDFB}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:#fff;color:var(--navy);font-weight:600}
.nav .n{font-family:var(--display);font-size:.8rem;opacity:.8}
.nav .done{width:1.1rem;height:1.1rem;border-radius:50%;border:2px solid currentColor;opacity:.45}
.nav .done.ok{background:var(--teal);border-color:var(--teal);opacity:1}
.side-foot{margin-top:auto;font-size:.85rem;color:#B9BEF0}
.side-foot button{all:unset;cursor:pointer;text-decoration:underline}

.main{padding:clamp(1.5rem,3vw,3.5rem) clamp(1.25rem,4vw,5rem) 5rem;max-width:100rem;width:100%;margin-inline:auto;min-width:0}
.topbar{display:none}
.kicker{color:var(--muted);font-weight:600;margin:0 0 .5rem}
h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;letter-spacing:-.02em;margin:0 0 1.25rem;max-width:24ch}
h2{font-family:var(--display);font-weight:500;font-size:1.35rem;line-height:1.25;margin:2.5rem 0 .9rem}
h3{font-size:1.1rem;margin:0 0 .4rem}
p{margin:0 0 1rem;max-width:66ch}
.lead{font-size:1.2rem;color:var(--muted);max-width:56ch}

.grid{display:grid;gap:1rem;grid-template-columns:repeat(auto-fit,minmax(min(100%,16rem),1fr))}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem 1.35rem}
.tile p{font-size:.98rem;margin:0;color:var(--muted)}
.tile ul{margin:.25rem 0 0;padding-left:1.1rem;color:var(--muted);font-size:.98rem}
.stat{font-family:var(--display);font-weight:700;font-size:2rem;color:var(--accent);line-height:1}
.note{background:var(--soft);color:var(--soft-ink);border-radius:14px;padding:1rem 1.25rem;margin:1.5rem 0;max-width:66ch}
.note strong{color:inherit}
.talk{border-left:4px solid var(--pink);padding:.25rem 0 .25rem 1rem;margin:1.25rem 0;max-width:62ch}
.talk p{margin:0;font-size:1.05rem}
.talk span{display:block;color:var(--muted);font-size:.9rem;margin-top:.35rem}

dl.gloss{display:grid;grid-template-columns:minmax(8rem,12rem) 1fr;gap:.6rem 1.25rem;margin:0}
dl.gloss dt{font-weight:700}
dl.gloss dd{margin:0;color:var(--muted)}

/* Catalog */
.tools{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.25rem}
.search{flex:1 1 16rem;font:inherit;padding:.7rem 1rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.chip{all:unset;cursor:pointer;padding:.45rem .85rem;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.area{margin:0 0 1.75rem;break-inside:avoid;page-break-inside:avoid;display:inline-block;width:100%}
.area h3{font-family:var(--display);font-weight:500;font-size:1rem;margin:0 0 .6rem}
.courses{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.courses li{display:flex;flex-wrap:wrap;gap:.35rem .75rem;align-items:baseline;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:.7rem 1rem}
.courses a{font-weight:600;text-decoration:none}
.courses a:hover{text-decoration:underline}
.type{font-size:.8rem;font-weight:700;padding:.15rem .55rem;border-radius:999px;background:var(--soft);color:var(--soft-ink);white-space:nowrap}
.type.master{background:var(--navy);color:#fff}
.type.esp{background:#FFE3EF;color:#8A0F45}
.empty{color:var(--muted)}

/* Global search */
.gsearch{position:relative}
.gsearch input{width:100%;font:inherit;font-size:.95rem;padding:.65rem 2rem .65rem 2.3rem;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff}
.gsearch input::placeholder{color:#B9BEF0}
.gsearch svg{position:absolute;left:.75rem;top:50%;transform:translateY(-50%);width:1rem;height:1rem;pointer-events:none}
.gsearch kbd{position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font:600 .75rem var(--body);color:#B9BEF0;border:1px solid rgba(255,255,255,.3);border-radius:5px;padding:0 .35rem}
.results{position:fixed;z-index:20;inset:0;background:rgba(3,6,30,.55);display:flex;justify-content:center;align-items:flex-start;padding:calc(env(safe-area-inset-top,0px) + 6vh) 1rem 1rem}
.results[hidden]{display:none}
.rpanel{background:var(--surface);color:var(--ink);width:min(100%,46rem);max-height:80vh;display:flex;flex-direction:column;border-radius:18px;box-shadow:0 24px 60px rgba(0,0,0,.35);overflow:hidden}
.rhead{display:flex;gap:.6rem;align-items:center;padding:1rem 1.1rem;border-bottom:1px solid var(--line)}
.rhead input{flex:1;min-width:0;font:inherit;font-size:1.1rem;border:0;background:transparent;color:var(--ink);padding:.3rem 0}
.rhead input:focus-visible{outline:none}
.rclose{all:unset;cursor:pointer;font-size:.85rem;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:.15rem .5rem}
.rlist{list-style:none;margin:0;padding:.5rem;overflow:auto}
.rlist button{all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;padding:.7rem .85rem;border-radius:10px}
.rlist button:hover,.rlist button.active{background:var(--soft)}
.rlist .rmod{font-size:.8rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.rlist .rtxt{display:block;margin-top:.15rem;font-size:.98rem;line-height:1.45}
.rlist mark,.main mark.hit{background:#FFE066;color:#0C1240;border-radius:3px;padding:0 1px}
.rempty,.rcount{padding:.9rem 1.2rem;color:var(--muted);font-size:.95rem;margin:0}
.rcount{padding:.5rem 1.2rem 0;font-size:.85rem}
.main mark.hit{animation:flash 2.2s ease}
@keyframes flash{0%,60%{box-shadow:0 0 0 4px #FFE066}100%{box-shadow:0 0 0 0 transparent}}
@media (prefers-reduced-motion: reduce){.main mark.hit{animation:none}}

/* Illustrations */
.ill{margin:0 0 2rem;max-width:80rem;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden}
.ill svg{display:block;width:100%;height:auto}
.ill.side-ill svg{max-height:22rem}
.ill figcaption{padding:.75rem 1.25rem;font-size:.92rem;color:var(--muted);border-top:1px solid var(--line)}
.ill.side-ill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);align-items:center}
.ill.side-ill figcaption{border-top:0;border-left:1px solid var(--line);font-size:1rem;padding:1.25rem 1.5rem}
@media (max-width:640px){.ill.side-ill{grid-template-columns:1fr}.ill.side-ill figcaption{border-left:0;border-top:1px solid var(--line)}}
.ill .hero-svg{height:clamp(170px,22vw,380px)}
.area-h{display:flex;align-items:center;gap:.6rem}
.area-h svg{width:34px;height:34px;flex:none}
.tile-ic{width:44px;height:44px;margin-bottom:.6rem;display:block}

/* Quiz */
.q{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:1.25rem 1.35rem;margin:0 0 1rem}
.q legend{font-weight:700;padding:0;margin:0 0 .75rem;font-size:1.05rem}
.q fieldset{border:0;margin:0;padding:0}
.opt{display:flex;gap:.6rem;align-items:flex-start;padding:.55rem .7rem;border-radius:10px;cursor:pointer;border:1px solid transparent}
.opt:hover{background:var(--bg)}
.opt input{margin-top:.35rem;accent-color:var(--navy)}
.opt.right{border-color:#1FA88F;background:rgba(48,217,196,.12)}
.opt.wrong{border-color:var(--pink);background:rgba(255,79,154,.1)}
.why{font-size:.95rem;color:var(--muted);margin:.6rem 0 0}

.actions{display:flex;flex-wrap:wrap;gap:.75rem;align-items:center;margin-top:2.5rem;padding-top:1.5rem;border-top:1px solid var(--line)}
.btn{all:unset;cursor:pointer;padding:.8rem 1.3rem;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.result{font-weight:700}

@media (min-width:1280px){
  .list-areas{columns:2;column-gap:2rem}
  .quiz-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1rem;align-items:start}
  .grid{grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr))}
  .lead{max-width:70ch}
}
@media (min-width:1600px){
  body{font-size:1.125rem}
}
@media (min-width:1700px){
  .list-areas{columns:3}
  .grid{gap:1.25rem}
}
@media (max-width: 860px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;padding:1.25rem}
  .side .nav,.side .side-foot{display:none}
  .side.open .nav{display:flex}
  .side.open .side-foot{display:block}
  .topbar{display:flex;justify-content:space-between;align-items:center;gap:1rem}
  .menu-btn{all:unset;cursor:pointer;padding:.5rem .8rem;border:1px solid rgba(255,255,255,.35);border-radius:10px;font-size:.9rem}
  .brand-wide{display:none}
  .main{padding-top:2rem}
  dl.gloss{grid-template-columns:1fr}
  dl.gloss dd{margin-bottom:.6rem}
}
@media (prefers-reduced-motion: reduce){ .belt{transition:none} }
</style>
</head>

function fig(key,cap,side){const f=el('figure',{class:'ill'+(side?' side-ill':'')});f.insertAdjacentHTML('afterbegin',SVG[key]);if(cap)f.append(el('figcaption',{},cap));return f;}
function icon(name,cls){const s=document.createElement('span');s.innerHTML=ICON[name]||'';const v=s.firstChild;if(v&&cls)v.setAttribute('class',cls);if(v){v.setAttribute('aria-hidden','true');}return v||'';}

const KEY='dojo-tokio-v1';
let state={done:{}, quiz:null, current:'marca'};
try{ const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) state=Object.assign(state,s); }catch(e){}
const save=()=>{ try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){} };

const nav=document.getElementById('nav'), main=document.getElementById('main');
function el(tag,attrs={},...kids){const n=document.createElement(tag);for(const[k,v] of Object.entries(attrs)){if(k==='class')n.className=v;else if(k==='html')n.innerHTML=v;else n.setAttribute(k,v);}kids.flat().forEach(k=>n.append(k?.nodeType?k:document.createTextNode(k??'')));return n;}

function renderBelt(){
  const n=MODULES.filter(m=>state.done[m.id]).length;
  const [name,color]=BELTS[n];
  document.getElementById('beltName').textContent=name+(n===MODULES.length?' · Sensei comercial':'');
  const b=document.getElementById('belt'); b.style.setProperty('--belt',color); b.setAttribute('aria-label','Cinturón '+name.toLowerCase()+', '+n+' de '+MODULES.length+' módulos completados');
  const steps=document.getElementById('beltSteps'); steps.replaceChildren(...MODULES.map((m,i)=>el('span',{class:i<n?'on':''})));
}
function renderNav(){
  nav.replaceChildren(...MODULES.map((m,i)=>{
    const b=el('button',{type:'button'},el('span',{class:'n'},String(i+1).padStart(2,'0')),el('span',{},m.title),el('span',{class:'done'+(state.done[m.id]?' ok':''),'aria-label':state.done[m.id]?'completado':'pendiente'}));
    if(m.id===state.current)b.setAttribute('aria-current','page');
    b.addEventListener('click',()=>go(m.id));
    return el('li',{},b);
  }));
}
function go(id){state.current=id;save();renderNav();renderPage();document.getElementById('side').classList.remove('open');document.getElementById('menuBtn').setAttribute('aria-expanded','false');main.focus({preventScroll:true});window.scrollTo({top:0});}

function footer(id){
  const idx=MODULES.findIndex(m=>m.id===id); const next=MODULES[idx+1];
  const wrap=el('div',{class:'actions'});
  if(id!=='examen'){
    const done=!!state.done[id];
    const b=el('button',{class:'btn',type:'button'},done?'Completado ✓':'Marcar como completado');
    b.addEventListener('click',()=>{state.done[id]=true;save();renderBelt();renderNav();if(next)go(next.id);else renderPage();});
    wrap.append(b);
  }
  if(next){const g=el('button',{class:'btn ghost',type:'button'},'Ir a '+next.title.toLowerCase());g.addEventListener('click',()=>go(next.id));wrap.append(g);}
  return wrap;
}

 examen:()=>{
  const out=[el('p',{class:'kicker'},'Módulo 7 de 7'),el('h1',{},'Examen final'),el('p',{class:'lead'},'Diez preguntas sobre todo lo anterior. Con 8 aciertos consigues el cinturón negro.'),fig('exam','Blanco, amarillo, naranja, verde, azul, morado, marrón y negro: un cinturón por cada módulo completado.',true)];
  const form=el('form',{novalidate:''});const qg=el('div',{class:'quiz-grid'});form.append(qg);
  QUIZ.forEach((it,i)=>{
    const fs=el('fieldset',{},el('legend',{},(i+1)+'. '+it.q));
    it.o.forEach((o,j)=>{fs.append(el('label',{class:'opt'},el('input',{type:'radio',name:'q'+i,value:String(j)}),el('span',{},o)));});
    fs.append(el('p',{class:'why',hidden:''},it.why));
    qg.append(el('div',{class:'q'},fs));
  });
  const res=el('span',{class:'result','aria-live':'polite'});
  const btn=el('button',{class:'btn',type:'submit'},'Corregir examen');
  const retry=el('button',{class:'btn ghost',type:'button',hidden:''},'Repetir examen');
  form.append(el('div',{class:'actions'},btn,retry,res));
  form.addEventListener('submit',e=>{
    e.preventDefault(); let ok=0, blank=0;
    QUIZ.forEach((it,i)=>{
      const chosen=form.querySelector(`input[name=q${i}]:checked`);
      const labels=form.querySelectorAll(`input[name=q${i}]`);
      labels.forEach(inp=>{const l=inp.closest('.opt');l.classList.remove('right','wrong');if(Number(inp.value)===it.a)l.classList.add('right');else if(inp.checked)l.classList.add('wrong');});
      labels[0].closest('fieldset').querySelector('.why').hidden=false;
      if(!chosen)blank++; else if(Number(chosen.value)===it.a)ok++;
    });
    state.quiz=ok;
    if(ok>=8){state.done.examen=true;res.textContent=`${ok}/10. Aprobado: ya tienes tu cinturón.`;}
    else res.textContent=`${ok}/10${blank?` (${blank} sin responder)`:''}. Necesitas 8 aciertos; revisa las explicaciones y vuelve a intentarlo.`;
    save();renderBelt();renderNav();retry.hidden=false;
  });

 }

document.getElementById('menuBtn').addEventListener('click',e=>{const s=document.getElementById('side');const o=s.classList.toggle('open');e.currentTarget.setAttribute('aria-expanded',String(o));});
document.getElementById('reset').addEventListener('click',()=>{if(confirm('¿Borrar tu progreso y empezar de nuevo?')){state={done:{},quiz:null,current:'marca'};save();renderBelt();renderNav();renderPage();}});

/* ---------- Búsqueda global ---------- */
const fold=t=>[...t].map(c=>(c.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().charAt(0))||c).join('');
const BLOCKS='h1,h2,h3,p,li,dt,dd,legend,label,figcaption,.stat';
let INDEX=null;
function buildIndex(){
  const out=[]; const saved=state.current;
  MODULES.forEach(m=>{
    state.current=m.id;
    const box=document.createElement('div'); box.append(...PAGES[m.id]());
    box.querySelectorAll(BLOCKS).forEach(n=>{
      if(n.querySelector('h1,h2,h3,p,li,dt,dd,legend,label'))return;
      const t=n.textContent.replace(/\s+/g,' ').trim(); if(t.length<2)return;
      out.push({mod:m.id,title:m.title,text:t,f:fold(t)});
    });
  });
  state.current=saved; return out;
}
const results=document.getElementById('results'),rInput=document.getElementById('rInput'),rList=document.getElementById('rList'),rCount=document.getElementById('rCount'),gInput=document.getElementById('gInput');
let active=-1,lastFocus=null;
function snippet(text,q){
  const i=fold(text).indexOf(q),start=Math.max(0,i-60),end=Math.min(text.length,i+q.length+90);
  const frag=document.createDocumentFragment();
  if(start>0)frag.append('…');
  frag.append(text.slice(start,i));const mk=document.createElement('mark');mk.textContent=text.slice(i,i+q.length);frag.append(mk,text.slice(i+q.length,end));
  if(end<text.length)frag.append('…');return frag;
}
function runSearch(){
  if(!INDEX)INDEX=buildIndex();
  const raw=rInput.value.trim(),q=fold(raw);rList.replaceChildren();active=-1;
  if(q.length<2){rCount.textContent=raw?'Escribe al menos 2 letras.':'Busca cualquier texto de los 7 módulos.';return;}
  const seen=new Set();
  const hits=INDEX.filter(e=>{if(!e.f.includes(q))return false;const k=e.mod+'|'+e.text;if(seen.has(k))return false;seen.add(k);return true;});
  rCount.textContent=hits.length?`${hits.length} resultado${hits.length>1?'s':''}`:'';
  if(!hits.length){rList.append(el('li',{},el('p',{class:'rempty'},`No hay resultados para «${raw}». Prueba con otra palabra.`)));return;}
  hits.slice(0,80).forEach(h=>{
    const b=el('button',{type:'button'},el('span',{class:'rmod'},h.title),el('span',{class:'rtxt'},snippet(h.text,q)));
    b.addEventListener('click',()=>openHit(h,q));rList.append(el('li',{},b));
  });
}
function openSearch(prefill){
  if(results.hidden)lastFocus=document.activeElement;
  results.hidden=false;rInput.value=prefill||'';runSearch();rInput.focus();
}
function closeSearch(){results.hidden=true;gInput.value='';if(lastFocus&&lastFocus!==gInput&&lastFocus.focus)lastFocus.focus();}
function openHit(h,q){
  results.hidden=true;gInput.value='';go(h.mod);
  requestAnimationFrame(()=>{
    const target=[...main.querySelectorAll(BLOCKS)].find(n=>n.textContent.replace(/\s+/g,' ').trim()===h.text)||main;
    const walker=document.createTreeWalker(target,NodeFilter.SHOW_TEXT);let node;
    while((node=walker.nextNode())){
      const i=fold(node.nodeValue).indexOf(q);if(i<0)continue;
      const r=document.createRange();r.setStart(node,i);r.setEnd(node,i+q.length);
      const mk=document.createElement('mark');mk.className='hit';r.surroundContents(mk);
      mk.scrollIntoView({block:'center',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
      setTimeout(()=>{if(mk.isConnected)mk.replaceWith(...mk.childNodes);},6000);
      return;
    }
    target.scrollIntoView({block:'center'});
  });
}
gInput.addEventListener('focus',()=>openSearch(gInput.value));
gInput.addEventListener('input',()=>openSearch(gInput.value));
rInput.addEventListener('input',runSearch);
document.getElementById('rClose').addEventListener('click',closeSearch);
results.addEventListener('click',e=>{if(e.target===results)closeSearch();});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&results.hidden&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();openSearch('');return;}
  if(results.hidden)return;
  const btns=[...rList.querySelectorAll('button')];
  if(e.key==='Escape'){e.preventDefault();closeSearch();}
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!btns.length)return;e.preventDefault();
    active=(active+(e.key==='ArrowDown'?1:-1)+btns.length)%btns.length;
    btns.forEach((b,i)=>b.classList.toggle('active',i===active));btns[active].scrollIntoView({block:'nearest'});
  }else if(e.key==='Enter'&&document.activeElement===rInput){const b=btns[active>=0?active:0];if(b){e.preventDefault();b.click();}}
  else if(e.key==='Tab'){const f=[rInput,...btns,document.getElementById('rClose')];const i=f.indexOf(document.activeElement);if(e.shiftKey&&i<=0){e.preventDefault();f[f.length-1].focus();}else if(!e.shiftKey&&i===f.length-1){e.preventDefault();f[0].focus();}}
});
renderBelt();renderNav();renderPage();
